<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResumeSkills 编辑器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#canvas">跳到简历画布</a>
  <header class="app-header">
    <strong class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4M9 12h6M9 15.5h6"/></svg>
      <span class="brand-name">ResumeSkills Canvas</span>
    </strong>
    <span id="source-name"></span>
    <span id="save-status" aria-live="polite">正在加载…</span>
  </header>
  <main class="layout">
    <aside class="guide">
      <h1>排版微调</h1>
      <p>单击选中文字后可直接打字修改；双击也可直接编辑。仅能编辑已有字段的纯文本。</p>
      <p>轻量修改后可直接写回本地 HTML；正式投递前仍需确认事实并重新验证 PDF。</p>
      <button id="save-html">保存修改</button>
      <button id="print-pdf" class="secondary">打印为 PDF</button>
      <p id="overflow-status" class="status"></p>
      <footer class="project-meta">
        <span>Created by Chasen-Liao</span>
        <a href="https://github.com/Chasen-Liao" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://github.com/Chasen-Liao/resume-skills" target="_blank" rel="noreferrer">Repository</a>
        <span>ResumeSkills v<span id="app-version">…</span></span>
        <span id="app-version-hint" class="version-hint" hidden></span>
      </footer>
    </aside>
    <section id="canvas" class="canvas" aria-label="A4 简历画布">
      <div id="resume-stage">
        <iframe id="resume-frame" title="可编辑简历预览" sandbox="allow-same-origin"></iframe>
      </div>
    </section>
    <aside class="inspector">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
        排版细节
      </h2>
      <p id="selection-name">请选择一段文字</p>
      <label id="selected-text-editor" hidden>
        <div class="label-header"><span>文字内容</span></div>
        <textarea id="selected-text" rows="4" aria-label="文字内容"></textarea>
      </label>
      <button id="reset-selected" class="secondary" type="button">恢复所选文字默认排版</button>

      <label>
        <div class="label-header"><span>字号 (px)</span></div>
        <div class="slider-group">
          <input type="range" class="sync-slider" data-target="font-size" min="8" max="30" step="0.5" value="10">
          <input id="font-size" type="number" min="8" max="30" step="0.5" value="10">
        </div>
      </label>

      <label>
        <div class="label-header"><span>字重</span></div>
        <select id="font-weight">
          <option value="">模板默认</option>
          <option value="400">常规</option>
          <option value="500">中等</option>
          <option value="600">半粗</option>
          <option value="700">加粗</option>
        </select>
      </label>

      <label>
        <div class="label-header"><span>颜色</span><input id="font-color" type="color" value="#09090b"></div>
      </label>

      <label>
        <div class="label-header"><span>对齐</span></div>
        <select id="text-align">
          <option value="">模板默认</option>
          <option value="left">左对齐</option>
          <option value="center">居中</option>
          <option value="right">右对齐</option>
        </select>
      </label>

      <label>
        <div class="label-header"><span>行高</span></div>
        <div class="slider-group">
          <input type="range" class="sync-slider" data-target="line-height" min="1" max="2" step="0.05" value="1.35">
          <input id="line-height" type="number" min="1" max="2" step="0.05" value="1.35">
        </div>
      </label>

      <label>
        <div class="label-header"><span>段后间距 (px)</span></div>
        <div class="slider-group">
          <input type="range" class="sync-slider" data-target="margin-bottom" min="0" max="48" step="1" value="0">
          <input id="margin-bottom" type="number" min="0" max="48" step="1" value="0">
        </div>
      </label>

      <hr>

      <label>
        <div class="label-header"><span>页边距 (mm)</span></div>
        <div class="slider-group">
          <input type="range" class="sync-slider" data-target="page-margin" min="8" max="20" step="0.5" value="10">
          <input id="page-margin" type="number" min="8" max="20" step="0.5" value="10">
        </div>
      </label>

      <label>
        <div class="label-header"><span>主题色</span><input id="accent-color" type="color" value="#2563eb"></div>
      </label>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
